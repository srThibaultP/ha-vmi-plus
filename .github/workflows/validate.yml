name: Validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install pytest-homeassistant-custom-component ruff
      # The bluetooth component imports its own requirements (habluetooth, aiousbwatcher, ...),
      # which pytest-homeassistant-custom-component does not install.
      - run: >-
          pip install $(python -c "import json, pathlib, homeassistant;
          d = pathlib.Path(homeassistant.__file__).parent / 'components';
          print(' '.join(r for c in ('bluetooth', 'bluetooth_adapters', 'usb')
          for r in json.loads((d / c / 'manifest.json').read_text()).get('requirements', [])))")
      - run: pip install "$(python -c "import json; print(json.load(open('custom_components/vmi_plus/manifest.json'))['requirements'][0])")"
      - run: ruff check custom_components tests
      - run: pytest --cov
