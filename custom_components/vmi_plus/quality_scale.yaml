rules:
  # Bronze
  action-setup: done
  appropriate-polling:
    status: done
    comment: The unit pushes nothing on its own; 10 s keeps remote-control and app changes visible.
  brands: todo
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency:
    status: todo
    comment: vmi-plus-ble is public and built by CI, not published on PyPI yet.
  docs-actions: todo
  docs-high-level-description: todo
  docs-installation-instructions: todo
  docs-removal-instructions: todo
  entity-event-setup:
    status: exempt
    comment: Entities only read the coordinator data.
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: No options flow.
  docs-installation-parameters: todo
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow:
    status: exempt
    comment: The unit has no authentication.
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: The Bluetooth address of a unit does not change.
  discovery: done
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations: todo
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: exempt
    comment: One device per config entry.
  entity-category: done
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow:
    status: exempt
    comment: Nothing to reconfigure besides the Bluetooth address, which identifies the unit.
  repair-issues:
    status: exempt
    comment: No user-fixable problem is reported by the unit yet.
  stale-devices:
    status: exempt
    comment: One device per config entry.

  # Platinum
  async-dependency: done
  inject-websession:
    status: exempt
    comment: Bluetooth only, no HTTP.
  strict-typing: done
