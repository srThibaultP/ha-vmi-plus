# Dashboard Lovelace qui reprend la mise en page de l'app VMI+ officielle
# (vitesse / boost / bypass / sondes) avec les entités de l'intégration vmi_plus.
#
# Installation : Paramètres → Tableaux de bord → Ajouter un tableau de bord →
# "Nouveau tableau de bord vide", puis menu (⋮) → Modifier en YAML, et coller
# le contenu ci-dessous (sans la ligne "views:" en double si l'éditeur en a
# déjà une).
#
# Toutes les entités référencées existent déjà dans l'intégration vmi_plus —
# aucune carte custom (HACS frontend) requise, uniquement des cartes intégrées
# à Home Assistant (tile, gauge, grid).
#
# ⚠️ Adapte le préfixe "urban_" des entity_id ci-dessous : Home Assistant le
# génère à partir du nom de TON appareil (Paramètres → Appareils → VMI+ →
# nom en haut de page), pas du nom de l'intégration. Si tu as renommé
# l'appareil, ou si la centrale s'est annoncée sous un autre nom que "Urban"
# à la découverte, ajuste en conséquence (vérifiable dans Outils de
# développement → États).

title: VMI+
views:
  - title: Urban
    path: vmi-plus
    icon: mdi:fan
    cards:
      - type: markdown
        content: "## 🌀 Ventilation"

      - type: tile
        entity: select.urban_vitesse
        name: Vitesse
        icon: mdi:fan
        features_position: bottom
        features:
          - type: select-options

      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: switch.urban_boost
            name: Boost 30 min
            icon: mdi:fan-plus
            vertical: true
          - type: tile
            entity: switch.urban_bypass
            name: Bypass (air neuf direct)
            icon: mdi:heat-wave
            vertical: true
          - type: tile
            entity: switch.urban_mode_nuit
            name: Mode nuit (sur-ventilation gratuite)
            icon: mdi:weather-night
            vertical: true
          - type: tile
            entity: switch.urban_holiday
            name: Holiday (absence prolongée)
            icon: mdi:bag-suitcase
            vertical: true

      - type: markdown
        content: "## 💧 Sondes"

      - type: grid
        columns: 2
        square: false
        cards:
          - type: gauge
            entity: sensor.urban_humidite_sonde_interne
            name: Humidité — sonde interne
            min: 0
            max: 100
            needle: true
            severity:
              green: 0
              yellow: 60
              red: 80
          - type: gauge
            entity: sensor.urban_humidite_piece
            name: Humidité — pièce (salle de bain)
            min: 0
            max: 100
            needle: true
            severity:
              green: 0
              yellow: 60
              red: 80

      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: sensor.urban_temperature_sonde_interne
            name: Température — sonde interne
            icon: mdi:thermometer
          - type: tile
            entity: sensor.urban_temperature_piece
            name: Température — pièce
            icon: mdi:thermometer

      - type: markdown
        content: "## ⚙️ Connexion"

      - type: tile
        entity: switch.urban_connexion_bluetooth
        name: Connexion Bluetooth
        icon: mdi:bluetooth

      - type: markdown
        content: >
          ℹ️ Vitesse/Boost/Bypass/Holiday/Mode nuit reflètent une vraie
          lecture de l'appareil (rafraîchie au plus toutes les 10s), pas
          seulement la dernière commande envoyée — voir README.
          Filtre, n° de série et historique ne sont pas (encore) disponibles
          en Bluetooth — voir PROTOCOL.md.
