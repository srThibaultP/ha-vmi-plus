# Lovelace dashboard laid out like the official VMI+ app (home screen, special
# modes, simplified configuration, maintenance) with the vmi_plus entities.
#
# Install: Settings → Dashboards → Add dashboard → "New dashboard from
# scratch", then menu (⋮) → Edit in YAML and paste the content below (drop the
# duplicate "views:" line if the editor already has one).
#
# Built-in cards only (tile, gauge, grid, entities), nothing to install from
# HACS.
#
# ⚠️ Adjust the "urban_" prefix of the entity_ids below: Home Assistant builds
# it from YOUR device name (Settings → Devices → VMI+ → name at the top), not
# from the integration name. Check them in Developer tools → States.

title: VMI+
views:
  - title: Urban
    path: vmi-plus
    icon: mdi:fan
    cards:
      - type: markdown
        content: "## 🌀 Ventilation"

      - type: tile
        entity: select.urban_vitesse
        name: Speed
        icon: mdi:fan
        features_position: bottom
        features:
          - type: select-options

      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: switch.urban_boost
            name: Boost 30 min
            icon: mdi:fan-plus
            vertical: true
          - type: tile
            entity: switch.urban_bypass
            name: Preheating
            icon: mdi:heat-wave
            vertical: true

      - type: gauge
        entity: sensor.urban_autonomie_filtre
        name: Filter (days left)
        min: 0
        max: 180
        needle: true
        severity:
          red: 0
          yellow: 15
          green: 45

      - type: markdown
        content: "## 🌙 Special modes"

      - type: grid
        columns: 2
        square: false
        cards:
          - type: tile
            entity: switch.urban_holiday
            name: Holiday
            icon: mdi:bag-suitcase
            vertical: true
          - type: tile
            entity: switch.urban_mode_nuit
            name: Night ventilation boost
            icon: mdi:weather-night
            vertical: true
          - type: tile
            entity: switch.urban_debit_fixe_radon
            name: Fixed air flow (radon)
            icon: mdi:radioactive
            vertical: true
          - type: tile
            entity: switch.urban_plages_horaires
            name: Time slots
            icon: mdi:calendar-clock
            vertical: true

      - type: markdown
        content: "## 💧 Measurements"

      - type: grid
        columns: 2
        square: false
        cards:
          - type: gauge
            entity: sensor.urban_humidite_sonde_interne
            name: Humidity — internal probe
            min: 0
            max: 100
            needle: true
            severity:
              green: 0
              yellow: 60
              red: 80
          - type: gauge
            entity: sensor.urban_humidite_piece
            name: Humidity — room (remote control)
            min: 0
            max: 100
            needle: true
            severity:
              green: 0
              yellow: 60
              red: 80
          - type: tile
            entity: sensor.urban_temperature_sonde_interne
            name: Temperature — internal probe
            icon: mdi:thermometer
          - type: tile
            entity: sensor.urban_temperature_piece
            name: Temperature — room
            icon: mdi:thermometer

      - type: markdown
        content: "## ⚙️ Simplified configuration"

      - type: entities
        entities:
          - entity: sensor.urban_debit_theorique
            name: Theoretical air flow
          - entity: number.urban_temperature_de_prechauffage
            name: Preheat to
          - entity: number.urban_limite_temperature_ete
            name: Summer limit
          - entity: sensor.urban_saison
            name: Season

      - type: markdown
        content: "## 🛠️ Maintenance"

      - type: entities
        entities:
          - entity: sensor.urban_jours_de_fonctionnement
            name: Operating days
          - entity: binary_sensor.urban_autotest
            name: Self-test
          - entity: binary_sensor.urban_bypass_echangeur
            name: Heat-exchanger bypass
          - entity: sensor.urban_capteurs_associes
            name: Paired sensors
          - entity: sensor.urban_version_logicielle
            name: Software version
          - entity: button.urban_localiser_led
            name: Locate (LED)
          - entity: button.urban_filtre_change_6_mois
            name: New filter fitted (6 months)
          - entity: button.urban_filtre_change_12_mois
            name: New filter fitted (12 months)
          - entity: switch.urban_connexion_bluetooth
            name: Bluetooth connection
